name: Fetch Daily Fixtures & Predictions

on:
  schedule:
    # Runs every day at 6:00 AM UTC (adjust timezone as needed)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch fixtures and predictions
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: node scripts/fetch.js

      - name: Commit and push updated data
        run: |
          git config user.name "MatchEdge Bot"
          git config user.email "bot@matchedge.app"
          git add data/matches.json
          git commit -m "Update daily fixtures and predictions" || echo "No changes to commit"
          git push
